name: Deploy Production

# Manual or dispatched after Release.
# Self-hosted runner on the VPS — scripts/ops/setup-github-runner.sh
#
# Flow (easy day-to-day):
# 1) Approve job on ubuntu-latest → environment production-gate ("Review deployments")
# 2) Deploy job on [self-hosted, production] → secrets from environment production
# 3) Health check https://testsambilngopi.my.id/health
#
# Prefer "use_main=true" for quick UI/backend deploys during active development.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = latest GitHub release)'
        required: false
      use_main:
        description: 'Deploy latest main (recommended for day-to-day)'
        type: boolean
        default: true
      force_no_cache:
        description: 'Docker build without layer cache (use after big UI changes)'
        type: boolean
        default: false
      notify_telegram:
        description: 'Send Telegram notification on success/failure'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROD_SITE_URL: https://testsambilngopi.my.id
  HEALTH_PUBLIC: https://testsambilngopi.my.id/health

jobs:
  approve:
    name: Review deployments
    runs-on: ubuntu-latest
    environment:
      name: production-gate
      url: https://testsambilngopi.my.id
    steps:
      - name: Waiting for reviewer approval
        run: |
          echo "Approved — production deploy may proceed."
          echo "Site: ${{ env.PROD_SITE_URL }}"
          echo "Environment: production-gate (required reviewers)."
          echo "Tip: keep self-hosted runner Idle before approving."

  deploy:
    name: Deploy to testsambilngopi.my.id
    needs: approve
    runs-on: [self-hosted, production]
    environment:
      name: production
      url: https://testsambilngopi.my.id
    outputs:
      deployed: ${{ steps.complete.outputs.deployed }}
      tag: ${{ steps.tag.outputs.tag }}
      deploy_tag: ${{ steps.notify_meta.outputs.deploy_tag }}
      release_notes_tag: ${{ steps.notify_meta.outputs.release_notes_tag }}

    steps:
      - name: Resolve deploy target
        id: tag
        run: |
          if [ "${{ github.event.inputs.use_main }}" = "true" ]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
            echo "Target: latest main branch"
            exit 0
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No published release found — set use_main=true or pass a tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target release tag: ${TAG}"

      - name: Validate deploy path
        env:
          PROD_APP_PATH: ${{ secrets.PROD_APP_PATH }}
        run: |
          if [ -z "${PROD_APP_PATH}" ]; then
            echo "Missing secret PROD_APP_PATH"
            exit 1
          fi
          if [ ! -d "${PROD_APP_PATH}" ]; then
            echo "Deploy path does not exist: ${PROD_APP_PATH}"
            echo "Expected a git checkout with docker-compose.yml + .env"
            exit 1
          fi
          echo "Deploy path OK: ${PROD_APP_PATH}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Deploy application
        id: deploy_check
        env:
          APP_PATH: ${{ secrets.PROD_APP_PATH }}
          FORCE_NO_CACHE: ${{ github.event.inputs.force_no_cache }}
          HEALTH_PUBLIC: ${{ env.HEALTH_PUBLIC }}
          PROD_SITE_URL: ${{ env.PROD_SITE_URL }}
        run: bash scripts/deploy/deploy-production.sh

      - name: Mark deploy complete
        id: complete
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve notify metadata
        id: notify_meta
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$TAG" = "main" ]; then
            SHA="$(git rev-parse HEAD)"
            echo "deploy_tag=main@${SHA}" >> "$GITHUB_OUTPUT"
            LATEST=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name // empty')
            echo "release_notes_tag=${LATEST}" >> "$GITHUB_OUTPUT"
            echo "Notify target: main@${SHA} (notes from ${LATEST:-none})"
          else
            echo "deploy_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_notes_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Notify target: ${TAG}"
          fi

      - name: Notify Telegram (success)
        if: >-
          success() &&
          github.event.inputs.notify_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_SITE_URL: ${{ env.PROD_SITE_URL }}
          DEPLOY_TAG: ${{ steps.notify_meta.outputs.deploy_tag || steps.tag.outputs.tag }}
          RELEASE_NOTES_TAG: ${{ steps.notify_meta.outputs.release_notes_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/notify/telegram-deploy-notify.sh success

      - name: Notify Telegram (failure)
        if: >-
          failure() &&
          github.event.inputs.notify_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_SITE_URL: ${{ env.PROD_SITE_URL }}
          DEPLOY_TAG: ${{ steps.notify_meta.outputs.deploy_tag || steps.tag.outputs.tag }}
          RELEASE_NOTES_TAG: ${{ steps.notify_meta.outputs.release_notes_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: bash scripts/notify/telegram-deploy-notify.sh failure
